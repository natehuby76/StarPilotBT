name: Verify iPhone route compatibility
on:
  push:
    branches: [verify/iphone-route-handoff]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SCALE: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./tools/op.sh setup
      - run: scons -j3 openpilot/starpilot/ui/native/_raylib_extra.so msgq_repo/msgq/visionipc/_visionipc.so rednose_repo/rednose/helpers/ekf_sym_pyx.so openpilot/selfdrive/locationd openpilot/common/libparams_c.so msgq_repo/msgq/_ipc.so openpilot/selfdrive/controls/lib/longitudinal_mpc_lib/c_generated_code/acados_ocp_solver_pyx.so
      - run: python -m pytest -q openpilot/starpilot/navigation/tests openpilot/starpilot/galaxy/tests/test_navigation_http.py openpilot/starpilot/galaxy/tests/test_vehicle_navigation.py openpilot/starpilot/system/starport/tests/test_nav_status.py openpilot/starpilot/system/starport/tests/test_projection_favorites.py openpilot/starpilot/galaxy_bluetooth/tests
